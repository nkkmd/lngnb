[package]
name = "lngnb"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "軽量な分散図書館・知識基盤（開発初期段階）"
repository = "https://github.com/nkkmd/lngnb"
publish = false

[dependencies]
sha2 = "=0.10.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize", "fast"] }
curve25519-dalek = "=4.1.3"
getrandom = "=0.2.16"
data-encoding = "=2.9.0"

[dev-dependencies]
serde_json = "=1.0.145"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
